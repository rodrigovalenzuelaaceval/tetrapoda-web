name: Deploy a tetrapoda.cl

on:
  workflow_dispatch:
  # Disparo automático (push) desactivado temporalmente: el FTP falla por
  # timeout (ticket de soporte #710411 con el hosting). Reactivar
  # reemplazando este bloque por el de "push" una vez resuelto.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build

      - name: Subir dist/ por FTP a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: public_html/
          dangerous-clean-slate: false
